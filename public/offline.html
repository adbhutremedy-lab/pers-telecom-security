<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PERS RRT - offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1b33;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  .box{max-width:320px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#cbd5e1;line-height:1.5;margin:0 0 20px}
  button{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <h1>No internet connection</h1>
    <p>PERS RRT needs a mobile data or Wi-Fi connection to receive alerts and share your location. It will reconnect on its own.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
